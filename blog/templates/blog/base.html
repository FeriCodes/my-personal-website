{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}My Blog{% endblock %}</title>
        <link rel="icon" type="image/x-icon" href="{% static 'blog/favicon.ico' %}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet" href="{% static 'blog/main.css' %}">
    </head>
    <body>
        <nav class="navbar custom-navbar px-3">
            <div class="container-fluid justify-content-start">
                <button class="navbar-toggler border-0 shadow-none"
                        type="button"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#sidebarMenu"
                        aria-controls="sidebarMenu"
                        style="padding: 2px 6px">
                    <span class="navbar-toggler-icon"
                          style="filter: invert(1);
                                 width: 1.2em;
                                 height: 1.2em"></span>
                </button>
                <a class="navbar-brand text-white ms-3" href="/">My Website</a>
            </div>
        </nav>

        <div class="offcanvas offcanvas-start custom-sidebar text-white"
             tabindex="-1"
             id="sidebarMenu"
             aria-labelledby="sidebarMenuLabel"
             style="width: 250px">
            <div class="offcanvas-header border-bottom"
                 style="border-color: #2d2942 !important">
                <h5 class="offcanvas-title" id="sidebarMenuLabel">Menu</h5>
                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="/routines/">My Routines</a>
                    </li>
                </ul>
            </div>
        </div>

        <main class="container mt-5">
            {% block content %}{% endblock %}
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        {% block scripts %}{% endblock %}
    </body>
</html>
